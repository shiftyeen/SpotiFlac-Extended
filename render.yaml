services:
  - type: web
    name: spotiflac-extended
    env: python
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8080
      - key: DISABLE_CLOUDFLARE_TUNNEL
        value: "0"
